type Query {
  users: [User!]!
  user(id: ID!): User
  posts: [Post!]!
  post(id: ID!): Post
  postsByAuthor(authorId: ID!): [Post!]!
  postsByTag(tag: String!): [Post!]!
}

type User {
  id: ID!
  name: String!
  email: String!
  role: Role!
  posts: [Post!]!
  comments: [Comment!]!
}

type Post {
  id: ID!
  title: String!
  body: String!
  published: Boolean!
  tags: [String!]!
  author: User!
  comments: [Comment!]!
}

type Comment {
  id: ID!
  text: String!
  author: User!
  post: Post!
}

enum Role {
  ADMIN
  EDITOR
  VIEWER
}
